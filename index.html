html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--c);color:var(--i);font:400 16px/1.6 Outfit,system-ui,sans-serif}
h1,h2,h3{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0;line-height:1.15}
img{max-width:100%;display:block}
.promo{background:var(--bl);color:var(--b);text-align:center;padding:10px 16px;font-size:14px;font-weight:500}
.hero{background:var(--b) var(--tx) center/cover no-repeat;color:var(--iv);text-align:center;padding:56px 18px 64px}@media(min-width:720px){.hero{padding:88px 20px 96px}}
.hero img{width:min(600px,92vw);height:auto;margin:0 auto 30px}
.hero p{margin:0 auto 26px;max-width:30ch;font-weight:300;font-size:18px;letter-spacing:.03em;opacity:.92}
.btn{display:inline-block;border:1px solid var(--b);background:var(--b);color:var(--iv);padding:13px 28px;border-radius:999px;font:500 15px Outfit,sans-serif;text-decoration:none;cursor:pointer}
.hero .btn{background:var(--iv);color:var(--b);border-color:var(--iv);letter-spacing:.08em}
.btn.alt{background:transparent;color:var(--b)}
.btn[disabled]{opacity:.45;cursor:default}
section{padding:48px 18px;max-width:1040px;margin:0 auto}
h2{font-size:32px;color:var(--b);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:24px}}
.card{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.card .ph{position:relative;aspect-ratio:1;overflow:hidden;background:var(--bl)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover img{transform:scale(1.04)}
.card h3{font-size:19px;margin:10px 0 2px}
.card span{font-size:15px;color:var(--b);font-weight:500}
.tag{position:absolute;top:8px;left:8px;background:var(--b);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px}
.steps{display:grid;gap:14px;padding:0;margin:0;list-style:none;counter-reset:s}
@media(min-width:720px){.steps{grid-template-columns:repeat(3,1fr)}}
.steps li{counter-increment:s;background:var(--bl);padding:20px;border-radius:4px}
.steps li:before{content:counter(s);font:28px "DM Serif Display",serif;color:var(--b);display:block}
.steps b{display:block;color:var(--b)}
.rev{background:#fff;border:1px solid var(--bl);padding:18px;border-radius:4px}
.rev i{color:var(--g);font-style:normal;letter-spacing:2px}
.rev p{margin:6px 0}
.rev small{color:var(--b);font-weight:500}.rev .rp{display:block;color:var(--i);opacity:.7;font-weight:400;margin:2px 0 0}.rc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.rc span{font-size:12px;background:var(--bl);color:var(--b);padding:3px 9px;border-radius:99px;letter-spacing:.02em}.rph{display:flex;gap:8px;margin:10px 0}.rph button{padding:0;border:0;background:none;width:64px;height:64px;border-radius:3px;overflow:hidden;cursor:zoom-in;transition:opacity .2s}.rph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.rempty{color:var(--i);opacity:.7;margin:0}#rvgrid{min-height:1px;grid-template-columns:1fr;gap:14px}@media(min-width:720px){#rvgrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}}
footer{background:var(--b) var(--tx) center/cover no-repeat;color:var(--iv);text-align:center;padding:44px 20px}
footer a{color:var(--iv);margin:0 10px}
.modal{position:fixed;inset:0;background:rgba(44,4,12,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}

/* ===================== v2 ===================== */
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--iv);color:var(--b);padding:12px 18px;border-radius:2px;font-weight:500;text-decoration:none}
.skip:focus{left:10px}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}

.sheet{overscroll-behavior:contain}

.promo{padding:13px 16px;line-height:1.35}
.promo b{display:block;font:400 18px/1.2 "DM Serif Display",Georgia,serif;letter-spacing:.05em}
.promo span{display:block;margin-top:3px;font-size:12.5px;font-weight:400;letter-spacing:.06em;opacity:.88}

.btn{border-radius:2px;text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;padding:16px 32px;text-align:center}
.btn.alt{transition:background .25s,color .25s}.btn.alt:hover{background:var(--b);color:var(--iv)}
.hero .btn{letter-spacing:.2em}

.adm .btn.alt:hover{background:none;color:var(--b)}

.ld .tr{display:none}

.va{margin-top:48px}

.chip:hover{border-color:var(--b)}

.tb-r{display:flex;flex-wrap:wrap;gap:12px 26px}
.sel{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--g)}
.sel select{font:400 15px Outfit,sans-serif;letter-spacing:0;text-transform:none;color:var(--i);background:none;border:0;border-bottom:1px solid var(--b);border-radius:0;padding:6px 4px;cursor:pointer}
.rcount{margin:0 0 28px;text-align:center;font-size:14px;letter-spacing:.08em;color:var(--g)}
.empty,.soon{text-align:center;padding:48px 0}
/* product page */
.pp{max-width:1180px;margin:0 auto;padding:32px 20px 24px}
@media(min-width:720px){.pp{padding:48px 32px 40px}}
.bc{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 32px;font-size:13px;letter-spacing:.06em;color:rgba(58,10,18,.7)}
.bc a,.bc .lk{color:inherit;text-decoration:none}.bc a:hover,.bc .lk:hover{text-decoration:underline}
.pp-g{display:grid;gap:36px}
@media(min-width:900px){.pp-g{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:80px;align-items:start}.pp-m{position:sticky;top:84px}}
.pp-m .gw{background:var(--bl)}
.th2{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.th2 button{flex:none;width:68px;height:68px;padding:0;border:1px solid transparent;background:none;cursor:pointer;opacity:.7}
.th2 button[aria-pressed=true]{border-color:var(--b);opacity:1}
.th2 img{width:100%;height:100%;object-fit:cover}
.pp-i h1{font-size:clamp(32px,5vw,46px);color:var(--b);margin:6px 0 14px}
.ptag{display:inline-block;margin:0 0 12px;padding:4px 10px;border:1px solid var(--g);font:500 11px Outfit,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--g)}
.pp-i .price{font-size:24px;margin:6px 0 20px}
.pp-i .dsc{margin:0 0 24px;font-size:16.5px;line-height:1.8}
.pp-i .dsc p{margin:0 0 12px}
.pbtn{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 14px}
.pbtn .btn{flex:1 1 200px}
.fine{margin:0 0 4px;font-size:13px;opacity:.7}
.gnote{margin:28px 0;padding:18px 20px;border:1px solid var(--bl);background:rgba(241,228,221,.4);text-align:center}
.gnote b{display:block;margin-bottom:4px;font:400 18px "DM Serif Display",Georgia,serif;letter-spacing:.03em;color:var(--b)}
.gnote span{font-size:13.5px;letter-spacing:.03em}
.acc{margin:0 0 20px}
.fq .lk{color:var(--b)}
.shr{display:block;margin:8px auto 0;font-size:14px;color:var(--b)}
.rel{max-width:none;padding:96px 0 32px}
@media(min-width:900px){.rel .grid{grid-template-columns:repeat(4,1fr)}}
.nf{text-align:center;padding:120px 20px}
.nf h1{color:var(--b);font-size:34px;margin-bottom:12px}
.nf p{margin:0 0 28px}
/* our story */
.ab{max-width:720px;margin:0 auto;padding:72px 22px 40px}
@media(min-width:720px){.ab{padding:120px 24px 64px}}
.ab-h{text-align:center;margin-bottom:64px}
.ab-h h1{font-size:clamp(38px,8vw,64px);line-height:1.08;color:var(--b);margin:6px 0 24px}
.lead{max-width:30em;margin:0 auto;font:italic 400 clamp(20px,3.4vw,25px)/1.55 "DM Serif Display",Georgia,serif;color:var(--i)}
.orn{display:block;position:relative;width:120px;height:1px;margin:44px auto 0;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.orn:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--c);border:1px solid var(--g);transform:translate(-50%,-50%) rotate(45deg)}
.ab-b{counter-reset:ch}
.ab-b p{margin:0 0 24px;font-size:17.5px;line-height:1.95}
.ab-b .ch{counter-increment:ch;margin:64px 0 20px;font-size:30px;color:var(--b)}
.ab-b .ch:before{content:counter(ch,upper-roman);display:block;margin-bottom:10px;font:500 12px Outfit,sans-serif;letter-spacing:.3em;color:var(--g)}
.ab-b blockquote{margin:56px 0;padding:34px 8px;border-top:1px solid var(--bl);border-bottom:1px solid var(--bl);text-align:center;font:italic 400 clamp(22px,4vw,28px)/1.5 "DM Serif Display",Georgia,serif;color:var(--b)}
.pil{list-style:none;margin:72px 0 0;padding:0;display:grid}

.pil b{display:block;margin-bottom:8px;font:400 22px "DM Serif Display",Georgia,serif;color:var(--b)}
.pil span{font-size:15px;line-height:1.7;opacity:.85}
.ab-c{text-align:center;margin:72px 0 32px}
.st{max-width:none;background:var(--bl)}
.st>div{max-width:620px;margin:0 auto;text-align:center}
.st h2{margin-bottom:18px}
.st p:not(.eyebrow){margin:0 0 30px;font-size:17.5px;line-height:1.85}
.rvs{max-width:1040px}

.gf b{display:block;margin-bottom:6px;font:400 18px "DM Serif Display",Georgia,serif;color:var(--b)}
.gf p{margin:2px 0;font-size:14px;color:var(--b)}

DEF.about={title:"Our Story",text:`# Born small. Curated with care.
> Pabbeau began the way most beautiful things do: quietly, with one small idea and a lot of heart.
## The beginning
Every Pab Beauty knows the feeling of finding the one piece that finally feels like her. We wanted to build a place where that moment happens more often: a small shop with a big eye for detail, where jewelry and accessories are chosen with intention, not piled on a shelf.
## Curated, never crowded
We’re a young brand, and we like it that way. Staying small lets us choose carefully: a necklace that catches the light just so, a bracelet that stacks beautifully, earrings you’ll reach for again and again. If it doesn’t feel special, it doesn’t make the collection.
> Wear one, stack a few, or keep it simple. Your style, your sparkle.
## Made personal
Behind every order is a real conversation. We chat with you on Messenger, confirm every detail, and send your order with a thank-you card, because you’re never just an order number to us. You’re a Pab Beauty.
## Growing, together
Pabbeau is still growing, and every message, review, and photo you share helps shape what we bring next. Thank you for being here at the beginning. We promise to keep making it worth it.`};
